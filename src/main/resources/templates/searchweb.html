<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🔍 鞋子搜尋引擎 🔍</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <div class="main-container">
        <div class="search-box-wrapper">
            <h1>🔍 鞋子搜尋引擎 🔍</h1>

            <form id="searchForm">
                <input type="text" id="keyword" placeholder="請輸入搜尋內容 (例如: puma speedcat)" required>
                <button type="submit">Search!</button>
            </form>
            
            <div id="loading" style="display: none; margin-top: 20px;">
                <div class="loader"></div>
                <p>正在啟動 Playwright 引擎並爬取資料，請稍候...</p>
            </div>

            <div id="resultsContainer" class="results-container">
                </div>
            
            <p id="noResult" class="no-result" style="display: none;">沒有找到結果。</p>
        </div>
    </div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault(); // 阻止表單跳轉
            
            const keyword = document.getElementById('keyword').value;
            const resultsContainer = document.getElementById('resultsContainer');
            const loadingDiv = document.getElementById('loading');
            const noResultMsg = document.getElementById('noResult');

            // 初始化 UI
            resultsContainer.innerHTML = '';
            noResultMsg.style.display = 'none';
            loadingDiv.style.display = 'block';

            // 步驟 1: 呼叫搜尋 API (觸發背景任務)
            fetch(`/api/search-tree?q=${encodeURIComponent(keyword)}&num=5&depth=2`)
                .then(response => {
                    if (response.status === 202) {
                        console.log("任務已接受，開始輪詢結果...");
                        // 開始輪詢 (Polling) 檢查結果
                        pollResults();
                    } else {
                        throw new Error("API 請求失敗");
                    }
                })
                .catch(err => {
                    console.error(err);
                    loadingDiv.style.display = 'none';
                    alert("系統發生錯誤，請檢查後端 Console");
                });
        });

        // 輪詢函數：每 2 秒檢查一次結果
        function pollResults() {
            // 注意：這裡假設您的後端在爬蟲完成前 /api/results 會回傳空陣列或舊資料
            // 由於 ApiMain 的邏輯是共用 static 變數，建議後端要有一個機制判斷「是否完成」
            // 這裡先簡單用 setTimeout 模擬等待爬蟲一段時間後再抓取
            
            // 暫時策略：等待 8 秒後抓取一次 (依據您的 testMain 耗時約需數秒)
            setTimeout(() => {
                fetch('/api/results')
                    .then(res => res.json())
                    .then(data => {
                        const loadingDiv = document.getElementById('loading');
                        const resultsContainer = document.getElementById('resultsContainer');
                        
                        loadingDiv.style.display = 'none';

                        if (!data || data.length === 0) {
                            document.getElementById('noResult').style.display = 'block';
                            return;
                        }

                        // 渲染資料
                        data.forEach(item => {
                            // 注意：後端的 RankedParentPage record 只有 url, aggregatedScore, keywordCounts
                            // 沒有 title，所以這裡暫時用 URL 當作標題
                            const itemDiv = document.createElement('div');
                            itemDiv.className = 'result-item';
                            
                            // 顯示分數與關鍵字統計 (選填)
                            const scoreInfo = ` (分數: ${item.aggregatedScore.toFixed(2)})`;
                            
                            itemDiv.innerHTML = `
                                <a href="${item.url}" target="_blank" class="result-title">${item.url}</a>
                                <span style="font-size:12px; color:#666;">${scoreInfo}</span>
                                <p class="result-url">${item.url}</p>
                                <p style="font-size: 13px; color: #555;">關鍵字命中: ${JSON.stringify(item.keywordCounts)}</p>
                            `;
                            resultsContainer.appendChild(itemDiv);
                        });
                    })
                    .catch(err => {
                        console.error(err);
                        document.getElementById('loading').style.display = 'none';
                    });
            }, 8000); // 等待 8 秒 (您可以根據實際爬蟲速度調整)
        }
    </script>
</body>
</html>
