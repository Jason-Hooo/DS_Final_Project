<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>鞋子評價搜尋引擎</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <div class="bg-animation">
        <div class="shoe s1"></div>
        <div class="shoe s2"></div>
        <div class="shoe s3"></div>
        <div class="shoe s4"></div>
        <div class="shoe s5"></div>
        <div class="shoe s6"></div>
        <div class="shoe s7"></div>
        <div class="shoe s8"></div>
        <div class="shoe s9"></div>
        <div class="shoe s10"></div>
        <div class="shoe s11"></div>
    </div>

    <div class="main-container">
        <div class="search-box-wrapper">
            <h1> 鞋類評價搜尋引擎 <img src="images/search-icon.png" alt="搜尋" class="search-icon"></h1>

            <form id="searchForm">
                <input type="text" id="keyword" placeholder="請輸入搜尋內容 (例如: puma speedcat)" required>
                <button type="submit">Search!</button>
            </form>
            
            <div id="loading" class="loading-container" style="display: none;">
                <div class="loader"></div>
                <p class="loading-text">正在搜尋中，請稍候...</p>
            </div>

            <div id="expandedKeywordsContainer" class="expanded-keywords-container" style="display: none;"></div>

            <div id="resultsContainer" class="results-container">
                </div>
            <div id="pagination" class="pagination"></div>
            <p id="noResult" class="no-result" style="display: none;">沒有找到結果。</p>
        </div>
    </div>
   

   <script>
        // 全域變數
        let allResults = [];
        let currentPage = 1;
        const itemsPerPage = 5; 

        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            const keyword = document.getElementById('keyword').value;
            
            // UI 初始化
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('pagination').innerHTML = '';
            document.getElementById('expandedKeywordsContainer').innerHTML = ''; // 清空關鍵字區
            document.getElementById('expandedKeywordsContainer').style.display = 'none';
            document.getElementById('noResult').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            allResults = [];
            currentPage = 1;

            // 呼叫 API
            fetch(`/api/search-tree?q=${encodeURIComponent(keyword)}`)
                .then(res => {
                    if (res.status === 202) pollResults();
                    else alert("API 請求失敗");
                });
        });

        // 輪詢資料
        let attempts = 0;
        const maxAttempts = 60; // 等待 120 秒

        function pollResults() {
            setTimeout(() => {
                fetch('/api/results')
                    .then(res => res.json())
                    .then(data => {
                        // 🔥 修正重點：從 data.results 取得資料，而不是直接用 data
                        // 這裡要相容兩種格式 (以防萬一)
                        const results = Array.isArray(data) ? data : (data.results || []);
                        const expandedKeywords = data.expandedKeywords || [];

                        // 情況 A: 資料是空的，且還沒超時 -> 繼續等
                        if (results.length === 0 && attempts < maxAttempts) {
                            attempts++;
                            console.log(`等待資料中... (${attempts}/${maxAttempts})`);
                            pollResults(); 
                        } 
                        // 情況 B: 抓到資料了！
                        else if (results.length > 0) {
                            document.getElementById('loading').style.display = 'none';
                            
                            // 1. 儲存資料
                            allResults = results;
                            
                            // 2. 顯示擴展關鍵字 (如果有)
                            if (expandedKeywords.length > 0) {
                                const kwContainer = document.getElementById('expandedKeywordsContainer');
                                kwContainer.style.display = 'flex';
                                kwContainer.innerHTML = expandedKeywords.map(k => 
                                    `<span class="keyword-tag" onclick="document.getElementById('keyword').value='${k}';">${k}</span>`
                                ).join('');
                            }

                            // 3. 渲染頁面
                            renderPage(1);
                            renderPagination();
                            
                            attempts = 0;
                        } 
                        // 情況 C: 超時
                        else {
                            document.getElementById('loading').style.display = 'none';
                            document.getElementById('noResult').style.display = 'block';
                        }
                    })
                    .catch(e => {
                        console.error("連線錯誤", e);
                        if(attempts < maxAttempts) { attempts++; pollResults(); }
                    });
            }, 2000);
        }

        function renderPage(page) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = ''; 
            currentPage = page;

            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = allResults.slice(start, end);

            pageData.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'webtree-root'; // 使用新的 CSS Class

                const url = item.url || "#";
                // 分數顯示邏輯
                let score = item.score !== undefined ? item.score : (item.aggregatedScore || 0);
                let content = item.content ? item.content.substring(0, 120) + "..." : "無內容";
                let title = item.title || url; // 優先顯示標題

                itemDiv.innerHTML = `
                    <div class="webtree-node">
                        <div class="result-header">
                            <a href="${url}" target="_blank" class="result-title">${title}</a>
                            <span class="result-score">${score.toFixed(1)}分</span>
                        </div>
                        <span class="result-url">${url}</span>
                        <p class="result-snippet">${content}</p>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
            renderPagination();
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            container.innerHTML = '';
            const totalPages = Math.ceil(allResults.length / itemsPerPage);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = (i === currentPage) ? 'page-btn active' : 'page-btn';
                btn.onclick = function() { renderPage(i); }; 
                container.appendChild(btn);
            }
        }
    </script>
 </body>
 </html>
