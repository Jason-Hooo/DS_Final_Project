<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>SHOOGLE</title>
    <link rel="stylesheet" href="style.css">
</headß

<body>
    <div class="bg-animation">
        <div class="batch-container batch-group-1">
            <div class="shoe s1"></div>
            <div class="shoe s2"></div>
            <div class="shoe s3"></div>
            <div class="shoe s4"></div>
        </div>

        <div class="batch-container batch-group-2">
            <div class="shoe s5"></div>
            <div class="shoe s6"></div>
            <div class="shoe s7"></div>
            <div class="shoe s8"></div>
        </div>

        <div class="batch-container batch-group-3">
            <div class="shoe s9"></div>
            <div class="shoe s10"></div>
            <div class="shoe s11"></div>
        </div>
    </div>

    <div class="main-container">
        <div class="search-box-wrapper">
            <h1> SHOOGLE <img src="images/search-icon.png" alt="搜尋" class="search-icon"></h1>

            <form id="searchForm">
                <input type="text" id="keyword" placeholder="請輸入搜尋內容 (例如: puma speedcat)" required>
                <button type="submit">Search!</button>
            </form>

            <div id="loading" class="loading-container" style="display: none;">
                <div class="loader"></div>
                <p class="loading-text">正在搜尋中，請稍候...</p>
            </div>

            <p id="correctionMsg" class="correction-msg" style="display: none;"></p>

            <div id="expandedKeywordsContainer" class="expanded-keywords-container" style="display: none;"></div>

            <div id="resultsContainer" class="results-container">
            </div>

            <div id="pagination" class="pagination"></div>

            <p id="noResult" class="no-result" style="display: none;">沒有找到結果。</p>
        </div>
    </div>


    <script>
        let allResults = [];
        let currentPage = 1;
        const itemsPerPage = 5;
        let currentSearchKeyword = "";

        function triggerSearch(newKeyword) {
            const input = document.getElementById('keyword');
            const form = document.getElementById('searchForm');
            
            input.value = newKeyword;
            
            if (form.requestSubmit) {
                form.requestSubmit();
            } else {
                form.querySelector('button[type="submit"]').click();
            }
        }

        document.getElementById('searchForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const keyword = document.getElementById('keyword').value;
            currentSearchKeyword = keyword;

            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('pagination').innerHTML = '';
            document.getElementById('expandedKeywordsContainer').innerHTML = '';
            document.getElementById('expandedKeywordsContainer').style.display = 'none';
            document.getElementById('noResult').style.display = 'none';
            document.getElementById('correctionMsg').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            allResults = [];
            currentPage = 1;

            fetch(`/api/search-tree?q=${encodeURIComponent(keyword)}`)
                .then(res => {
                    if (res.status === 202) pollResults();
                    else alert("API 請求失敗");
                });
        });

        window.addEventListener('beforeunload', function () {
            navigator.sendBeacon('/api/stop');
        });

        let attempts = 0;
        const maxAttempts = 60;

        function pollResults() {
            setTimeout(() => {
                fetch('/api/results')
                    .then(res => res.json())
                    .then(data => {
                        const results = Array.isArray(data) ? data : (data.results || []);
                        const expandedKeywords = data.expandedKeywords || [];
                        const status = data.status || 'processing';
                        const query = data.query;

                        if (status === 'completed' && query && currentSearchKeyword && 
                            query.trim().toLowerCase() !== currentSearchKeyword.trim().toLowerCase()) {
                            const msgEl = document.getElementById('correctionMsg');
                            msgEl.style.display = 'block';
                            msgEl.innerHTML = `已自動修正關鍵字為: <strong>${query}</strong>`;
                        }

                        if (status === 'processing') {
                            attempts++;
                            console.log(`等待資料中... (${attempts}/${maxAttempts})`);
                            if (attempts < maxAttempts) {
                                pollResults();
                            } else {
                                document.getElementById('loading').style.display = 'none';
                                document.getElementById('noResult').style.display = 'block';
                            }
                        }
                        else if (status === 'completed' && results.length > 0) {
                            document.getElementById('loading').style.display = 'none';

                            allResults = results;

                            if (expandedKeywords.length > 0) {
                                const kwContainer = document.getElementById('expandedKeywordsContainer');
                                kwContainer.style.display = 'flex';
                                kwContainer.innerHTML = expandedKeywords.map(k =>
                                    `<span class="keyword-tag" onclick="triggerSearch('${k}')">${k}</span>`
                                ).join('');
                            }

                            renderPage(1);
                            renderPagination();

                            attempts = 0;
                        }
                        else {
                            document.getElementById('loading').style.display = 'none';
                            document.getElementById('noResult').style.display = 'block';
                        }
                    })
                    .catch(e => {
                        console.error("連線錯誤", e);
                        if (attempts < maxAttempts) { attempts++; pollResults(); }
                    });
            }, 2000);
        }

        function renderPage(page) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';
            currentPage = page;

            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = allResults.slice(start, end);

            pageData.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'webtree-root';

                const url = item.url || "#";
                let score = item.score !== undefined ? item.score : (item.aggregatedScore || 0);
                let content = item.content ? item.content.substring(0, 150) + "..." : "無內容";
                let title = item.title || url;

                let domain = '';
                let faviconUrl = '';
                try {
                    if (url !== "#") {
                        domain = new URL(url).hostname;
                        faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
                    }
                } catch (e) { console.log("URL Parse Error", e); }

                const hasThumbnail = item.thumbnail && item.thumbnail !== "";

                itemDiv.innerHTML = `
                    <div class="webtree-node">
                        <div class="result-content-wrapper">
                            
                            <div class="result-main-content">
                                <div class="result-header">
                                    ${faviconUrl ? `<img src="${faviconUrl}" alt="" class="result-favicon" onerror="this.style.display='none'">` : ''}
                                    
                                    <div style="flex: 1;">
                                        <a href="${url}" target="_blank" class="result-title">${title}</a>
                                        <span class="result-url">${domain || url}</span>
                                    </div>
                                </div>
                                
                                <p class="result-snippet">${content}</p>
                                <span class="result-score">${score.toFixed(1)}分</span>
                            </div>

                            ${hasThumbnail ? `
                            <div class="result-thumbnail">
                                <img src="${item.thumbnail}" alt="縮圖" class="thumbnail-image" onerror="this.style.display='none'">
                            </div>
                            ` : ''}

                        </div>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
            renderPagination();
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            container.innerHTML = '';
            const totalPages = Math.ceil(allResults.length / itemsPerPage);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = (i === currentPage) ? 'page-btn active' : 'page-btn';
                btn.onclick = function () { renderPage(i); };
                container.appendChild(btn);
            }
        }
    </script>
</body>

</html>
